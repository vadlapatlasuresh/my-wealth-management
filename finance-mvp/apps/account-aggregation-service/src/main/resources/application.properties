spring.application.name=account-aggregation-service
server.port=8082

# Active profile: dev uses in-memory H2 (see application-dev.properties)
spring.profiles.active=dev

# Plaid Configuration — credentials come from the environment (never commit secrets).
# Set PLAID_CLIENT_ID / PLAID_SECRET in your .env (see .env.cross-platform.example).
# NOTE: the previously committed sandbox keys must be rotated in the Plaid dashboard.
plaid.client-id=${PLAID_CLIENT_ID:}
plaid.secret=${PLAID_SECRET:}
plaid.env=${PLAID_ENV:sandbox}
plaid.client-name=${PLAID_CLIENT_NAME:My Wealth Management}

# JWT Configuration (must match auth-service). Env-overridable; prod sets JWT_SECRET.
jwt.secret=${JWT_SECRET:THIS_IS_A_VERY_LONG_AND_SECURE_SECRET_KEY_FOR_JWT_AUTHENTICATION_DEMO_PURPOSES_ONLY_REPLACE_IN_PRODUCTION}
jwt.expiration=86400000

# AES key used to encrypt Plaid access tokens at rest (REQUIRED in production).
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Plaid webhook verification. Off in dev/sandbox; set true in production.
plaid.webhook.verify=${PLAID_WEBHOOK_VERIFY:false}

# ---------------------------------------------------------------------------
# Credit monitoring (Phase 4) — config flag + mock fallback, see CreditBureauRouter.
#   demo (default) → deterministic, clearly-labeled demo profile (no credentials needed)
#   http           → a contracted bureau/reseller over HTTPS (HttpCreditBureauProvider)
# An unconfigured or failing 'http' provider silently degrades to 'demo'; it never
# relabels demo numbers as a real score. FCRA note: docs/THIRD_PARTY_VENDORS.md.
# ---------------------------------------------------------------------------
credit.provider=${CREDIT_PROVIDER:demo}
credit.http.base-url=${CREDIT_BUREAU_BASE_URL:}
credit.http.profile-path=${CREDIT_BUREAU_PROFILE_PATH:/v1/consumers/{userId}/credit-profile}
# Auth — either a static API key, or OAuth2 client_credentials. Set one.
credit.http.api-key=${CREDIT_BUREAU_API_KEY:}
credit.http.api-key-header=${CREDIT_BUREAU_API_KEY_HEADER:X-API-Key}
credit.http.token-url=${CREDIT_BUREAU_TOKEN_URL:}
credit.http.client-id=${CREDIT_BUREAU_CLIENT_ID:}
credit.http.client-secret=${CREDIT_BUREAU_CLIENT_SECRET:}
# Vendor field mapping (dotted paths). Defaults match our documented contract; override
# per reseller so switching vendors is a config change, not a code change.
credit.http.path.score=${CREDIT_BUREAU_PATH_SCORE:score}
credit.http.path.delta=${CREDIT_BUREAU_PATH_DELTA:delta}
credit.http.path.as-of=${CREDIT_BUREAU_PATH_AS_OF:asOf}
credit.http.path.history=${CREDIT_BUREAU_PATH_HISTORY:history}
credit.http.path.utilization-pct=${CREDIT_BUREAU_PATH_UTIL_PCT:utilization.pct}
credit.http.path.utilization-balance=${CREDIT_BUREAU_PATH_UTIL_BALANCE:utilization.balance}
credit.http.path.utilization-limit=${CREDIT_BUREAU_PATH_UTIL_LIMIT:utilization.limit}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# notification-service (server-to-server, shared internal key) — account-linked alerts.
service.notification.url=${NOTIFICATION_URI:http://localhost:8088}
notifications.internal.key=${NOTIFICATIONS_INTERNAL_KEY:}

# Observability: expose health + Prometheus metrics for scraping.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=account-aggregation-service

# Correlation id in every log line (set by RequestIdFilter from X-Request-Id).
logging.pattern.level=%5p [req:%X{requestId:-}]
