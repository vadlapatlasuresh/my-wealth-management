<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TerraVest V3 — Financial Operating System</title>
<meta name="color-scheme" content="light dark">
<!--
  TerraVest V3 — Financial Operating System (standalone prototype, final)
  Self-contained, no build step. Brand fonts (DM Serif Display + DM Sans) from
  Google Fonts for local viewing; icons are an inline SVG sprite. The Artifact
  twin uses a system-font fallback under the claude.ai CSP.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
<style>
/* ============================================================================
   TerraVest V3 — Financial Operating System
   Self-contained (CSP-safe): inline SVG icons, system font pairing.
   Brand preserved: Forest / Sage / Gold.
   ============================================================================ */

/* ---- 1 · TOKENS ---------------------------------------------------------- */
:root{
  --font-display:'DM Serif Display','Iowan Old Style',Palatino,Georgia,serif;
  --font-body:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;

  --fs-display-xl:clamp(2.3rem,4.4cqi,3.3rem);
  --fs-display:clamp(1.75rem,3.2cqi,2.4rem);
  --fs-h2:1.28rem; --fs-title:1.05rem; --fs-body:.94rem;
  --fs-sm:.83rem; --fs-xs:.75rem; --fs-over:.68rem;

  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:32px;--sp-8:40px;--sp-9:48px;--sp-10:64px;
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:26px;--r-full:999px;

  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --d1:.12s;--d2:.2s;--d3:.34s;--d4:.55s;

  --rail-w:250px; --rail-w-min:74px; --bar-h:60px; --hub-h:46px; --maxw:1460px;

  /* brand anchors (never themed) */
  --forest:#1A4D3B; --forest-mid:#24614A; --forest-light:#3D8A68;
  --sage:#8AB89A; --sage-soft:#C4DDD0; --brand-gold:#C9973A;
}

/* ---- Light (chosen, green-biased neutrals) ---- */
:root,:root[data-theme="light"]{
  --bg:#F4F7F5; --bg-2:#EDF3EF;
  --surface:#FFFFFF; --surface-2:#F2F7F3; --surface-3:#E9F0EB;
  --glass:rgba(255,255,255,.74); --glass-bd:rgba(26,77,59,.12);
  --border:#DEE8E1; --border-strong:#C7D6CC;
  --ink:#11201A; --ink-2:#3A5147; --ink-3:#6B8579; --on-accent:#FFFFFF;
  --accent:#1A4D3B; --accent-2:#3D8A68; --accent-soft:#E7F1EB; --accent-line:rgba(26,77,59,.16);
  --gold:#B0821F; --gold-soft:#F7EDD6;
  --pos:#157347; --pos-soft:#E2F1E8; --neg:#C0392B; --neg-soft:#FBEAE7;
  --warn:#9A6B14; --warn-soft:#FAEFD7; --info:#2560A8; --info-soft:#E7EFFA;
  --c1:#2F7D5C; --c2:#C9973A; --c3:#5B7CC4; --c4:#8A6FC9; --c5:#4FA9A2; --c6:#C9636B;
  --sh1:0 1px 2px rgba(16,32,26,.06),0 1px 3px rgba(16,32,26,.05);
  --sh2:0 4px 14px rgba(16,32,26,.08),0 2px 6px rgba(16,32,26,.05);
  --sh3:0 14px 38px rgba(16,32,26,.12),0 6px 14px rgba(16,32,26,.07);
  --sh-pop:0 26px 66px rgba(16,32,26,.22);
}
/* ---- Dark (premium green-black) ---- */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0A110E; --bg-2:#0D1611;
    --surface:#131F19; --surface-2:#182720; --surface-3:#1F332A;
    --glass:rgba(19,31,25,.68); --glass-bd:rgba(255,255,255,.08);
    --border:#24382E; --border-strong:#33493E;
    --ink:#E9F2ED; --ink-2:#A6C0B4; --ink-3:#6E887C; --on-accent:#06120D;
    --accent:#5FBB90; --accent-2:#6FC79C; --accent-soft:rgba(95,187,144,.15); --accent-line:rgba(95,187,144,.28);
    --gold:#E4B563; --gold-soft:rgba(228,181,99,.15);
    --pos:#58CC8B; --pos-soft:rgba(88,204,139,.15); --neg:#F0796F; --neg-soft:rgba(240,121,111,.15);
    --warn:#E4B563; --warn-soft:rgba(228,181,99,.15); --info:#7CA8E6; --info-soft:rgba(124,168,230,.15);
    --c1:#5FBB90; --c2:#E4B563; --c3:#7CA8E6; --c4:#B79BEA; --c5:#5FC2BA; --c6:#E68A91;
    --sh1:0 1px 2px rgba(0,0,0,.4);
    --sh2:0 6px 18px rgba(0,0,0,.42); --sh3:0 16px 40px rgba(0,0,0,.5); --sh-pop:0 28px 70px rgba(0,0,0,.6);
  }
}
/* explicit toggle wins over media query, both directions */
:root[data-theme="dark"]{
  --bg:#0A110E; --bg-2:#0D1611;
  --surface:#131F19; --surface-2:#182720; --surface-3:#1F332A;
  --glass:rgba(19,31,25,.68); --glass-bd:rgba(255,255,255,.08);
  --border:#24382E; --border-strong:#33493E;
  --ink:#E9F2ED; --ink-2:#A6C0B4; --ink-3:#6E887C; --on-accent:#06120D;
  --accent:#5FBB90; --accent-2:#6FC79C; --accent-soft:rgba(95,187,144,.15); --accent-line:rgba(95,187,144,.28);
  --gold:#E4B563; --gold-soft:rgba(228,181,99,.15);
  --pos:#58CC8B; --pos-soft:rgba(88,204,139,.15); --neg:#F0796F; --neg-soft:rgba(240,121,111,.15);
  --warn:#E4B563; --warn-soft:rgba(228,181,99,.15); --info:#7CA8E6; --info-soft:rgba(124,168,230,.15);
  --c1:#5FBB90; --c2:#E4B563; --c3:#7CA8E6; --c4:#B79BEA; --c5:#5FC2BA; --c6:#E68A91;
  --sh1:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 6px 18px rgba(0,0,0,.42); --sh3:0 16px 40px rgba(0,0,0,.5); --sh-pop:0 28px 70px rgba(0,0,0,.6);
}

/* ---- 2 · RESET / BASE ---------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  transition:background var(--d3) var(--ease),color var(--d3) var(--ease)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.stack{display:flex;flex-direction:column}.row{display:flex;align-items:center}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}.mla{margin-left:auto}
.gap-1{gap:var(--sp-1)}.gap-2{gap:var(--sp-2)}.gap-3{gap:var(--sp-3)}.gap-4{gap:var(--sp-4)}.gap-5{gap:var(--sp-5)}.gap-6{gap:var(--sp-6)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:var(--r-full)}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ---- 3 · SHELL ----------------------------------------------------------- */
.app{display:grid;grid-template-columns:var(--rail-w) 1fr;height:100vh;overflow:hidden}
.app.rail-min{grid-template-columns:var(--rail-w-min) 1fr}

.rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;position:relative;z-index:30}
.brand{height:var(--bar-h);display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5);border-bottom:1px solid var(--border);flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(140deg,var(--forest-light),var(--forest));box-shadow:0 4px 14px rgba(26,77,59,.35);color:#fff}
.brand-mark .ic{font-size:19px}
.brand-name{font-family:var(--font-display);font-size:1.16rem;line-height:1;letter-spacing:.01em}
.brand-sub{font-size:var(--fs-over);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.rail-min .brand-text,.rail-min .nav-txt,.rail-min .nav-badge,.rail-min .grp-label span,.rail-min .grp-chev,
.rail-min .who-meta,.rail-min .who .ic-dots{display:none}
.rail-min .brand{justify-content:center;padding:0}
.rail-min .nav-link{justify-content:center;padding:10px 0}
.rail-min .grp-label{justify-content:center;padding:8px 0 2px}

.rail-scroll{flex:1;min-height:0;overflow-y:auto;padding:var(--sp-3) var(--sp-3) var(--sp-6)}
.rail-scroll::-webkit-scrollbar{width:0}
.grp{margin-top:var(--sp-2)}.grp:first-child{margin-top:0}
.grp-label{display:flex;align-items:center;gap:6px;padding:var(--sp-3) var(--sp-3) 4px;font-size:var(--fs-over);
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;user-select:none;cursor:pointer}
.grp-chev{margin-left:auto;font-size:14px;transition:transform var(--d2) var(--ease)}
.grp.closed .grp-chev{transform:rotate(-90deg)}
.grp.closed .nav-link{display:none}
.nav-link{display:flex;align-items:center;gap:var(--sp-3);padding:9px var(--sp-3);border-radius:var(--r-sm);
  color:var(--ink-2);font-size:var(--fs-sm);font-weight:500;position:relative;margin-bottom:1px;
  transition:background var(--d1),color var(--d1)}
.nav-link .ic{font-size:19px;width:22px}
.nav-link:hover{background:var(--surface-3);color:var(--ink)}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-link.active::before{content:'';position:absolute;left:-3px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-badge{margin-left:auto;min-width:19px;height:19px;padding:0 6px;display:grid;place-items:center;border-radius:var(--r-full);
  background:var(--gold);color:var(--on-accent);font-size:var(--fs-over);font-weight:700}
.rail-foot{border-top:1px solid var(--border);padding:var(--sp-3);flex-shrink:0}
.who{display:flex;align-items:center;gap:var(--sp-3);padding:8px;border-radius:var(--r-sm);cursor:pointer;transition:background var(--d1)}
.who:hover{background:var(--surface-3)}
.avatar{width:34px;height:34px;border-radius:var(--r-full);flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm);
  background:linear-gradient(140deg,var(--forest-light),var(--forest));color:#fff}
.who-name{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-role{font-size:var(--fs-xs);color:var(--ink-3)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:var(--bar-h);flex-shrink:0;display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5);
  background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:relative;z-index:20}
.iconbtn{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);font-size:19px;
  position:relative;transition:background var(--d1),color var(--d1)}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn .ping{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--neg);border:2px solid var(--surface)}
.omnibar{flex:1;max-width:440px;height:40px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);
  border-radius:var(--r-full);background:var(--surface-3);border:1px solid transparent;color:var(--ink-3);font-size:var(--fs-sm);
  transition:border-color var(--d2),background var(--d2)}
.omnibar:hover{border-color:var(--border-strong)}
.kbd{font-size:var(--fs-xs);font-weight:600;color:var(--ink-3);padding:2px 7px;border-radius:6px;background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--sh1)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r-full);padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:600;color:var(--ink-3);white-space:nowrap;transition:all var(--d2)}
.seg button.active{background:var(--surface);color:var(--accent);box-shadow:var(--sh1)}
.seg.icons button{width:32px;height:28px;padding:0;display:grid;place-items:center;font-size:16px}

.viewport{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth}
.ws{display:none}
.ws.active{display:block;animation:wsIn var(--d3) var(--ease)}
@keyframes wsIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.container{max-width:var(--maxw);margin:0 auto;padding:var(--sp-6) var(--sp-7) var(--sp-10)}
/* secondary hub tab-bar (primary workspace → its sub-workspaces) */
.hub-bar{position:sticky;top:0;z-index:16;height:var(--hub-h);display:flex;align-items:stretch;gap:var(--sp-1);padding:0 var(--sp-7);background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.hub-bar::-webkit-scrollbar{display:none}
.hub-tab{padding:0 var(--sp-3);font-size:var(--fs-sm);font-weight:600;color:var(--ink-3);white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.hub-tab:hover{color:var(--ink)}
.hub-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.hub-tab .nav-badge{position:static}
@media(max-width:920px){.hub-bar{padding:0 var(--sp-4)}}

/* ---- 4 · TYPE HELPERS ---------------------------------------------------- */
.wshead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5)}
.eyebrow{font-size:var(--fs-over);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.ws-title{font-family:var(--font-display);font-size:var(--fs-display);line-height:1.06;letter-spacing:-.01em;text-wrap:balance}
.ws-sub{color:var(--ink-3);font-size:var(--fs-body);margin-top:5px;max-width:60ch}
.sec-title{font-size:var(--fs-title);font-weight:700;letter-spacing:-.01em}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.more{font-size:var(--fs-sm);font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.more:hover{text-decoration:underline}

/* ---- 5 · ACTION BAR (universal) ----------------------------------------- */
.actionbar{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-5);
  padding:var(--sp-2);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh1)}
.actionbar .ab-search{flex:1;min-width:180px;height:38px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);
  border-radius:var(--r-sm);background:var(--surface-3);color:var(--ink-3);font-size:var(--fs-sm)}
.actionbar .divider{width:1px;align-self:stretch;background:var(--border);margin:0 2px}

/* ---- 6 · BUTTONS / CHIPS / BADGES --------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);padding:9px var(--sp-4);border-radius:var(--r-sm);
  font-size:var(--fs-sm);font-weight:600;white-space:nowrap;transition:transform var(--d1) var(--ease),background var(--d2),box-shadow var(--d2),border-color var(--d2)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn .ic{font-size:17px}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px rgba(26,77,59,.24)}
.btn-primary:hover{background:var(--accent-2);box-shadow:0 6px 20px rgba(26,77,59,.3)}
.btn-ghost{background:var(--surface-3);color:var(--ink)}.btn-ghost:hover{background:var(--border)}
.btn-outline{border:1px solid var(--border-strong);color:var(--ink-2)}.btn-outline:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-gold{background:var(--gold);color:var(--on-accent)}
.btn-sm{padding:7px 12px;font-size:var(--fs-xs);border-radius:var(--r-xs)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:600;
  white-space:nowrap;background:var(--surface-3);color:var(--ink-2);border:1px solid transparent;transition:all var(--d2)}
.chip:hover{border-color:var(--border-strong);color:var(--ink)}
.chip.active{background:var(--accent);color:var(--on-accent)}
.chip .ic{font-size:14px}
.chiprow{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chiprow::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.badge .ic{font-size:13px}
.badge.pos{background:var(--pos-soft);color:var(--pos)}.badge.neg{background:var(--neg-soft);color:var(--neg)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.info{background:var(--info-soft);color:var(--info)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}.badge.neutral{background:var(--surface-3);color:var(--ink-2)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:var(--fs-sm)}
.delta.up{color:var(--pos)}.delta.down{color:var(--neg)}

/* ---- 7 · CARDS / GRID ---------------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-5);box-shadow:var(--sh1);
  transition:box-shadow var(--d2),border-color var(--d2),transform var(--d2)}
.card.lg{padding:var(--sp-6)}
.card.act{cursor:pointer}
.card.act:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--border-strong)}
.card.glass{background:var(--glass);backdrop-filter:blur(14px);border-color:var(--glass-bd)}
.grid{display:grid;gap:var(--sp-5)}
.g12{grid-template-columns:repeat(12,1fr)}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.tile{width:42px;height:42px;border-radius:var(--r-sm);flex-shrink:0;display:grid;place-items:center;font-size:19px;background:var(--accent-soft);color:var(--accent)}
.tile.sm{width:32px;height:32px;font-size:15px}
.tile.gold{background:var(--gold-soft);color:var(--gold)}.tile.info{background:var(--info-soft);color:var(--info)}
.tile.neg{background:var(--neg-soft);color:var(--neg)}.tile.pos{background:var(--pos-soft);color:var(--pos)}
.tile.violet{background:rgba(138,111,201,.16);color:var(--c4)}

/* KPI */
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:var(--sp-4)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);
  box-shadow:var(--sh1);container-type:inline-size;min-width:0;transition:box-shadow var(--d2),transform var(--d2),border-color var(--d2)}
.kpi.act{cursor:pointer}.kpi.act:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--border-strong)}
.kpi-top{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.kpi-ic{width:30px;height:30px;border-radius:var(--r-xs);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.kpi-label{font-size:var(--fs-sm);font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-chev{margin-left:auto;color:var(--ink-3);font-size:15px;opacity:.5;transition:transform var(--d2),opacity var(--d2)}
.kpi.act:hover .kpi-chev{opacity:1;transform:translateX(3px)}
.kpi-val{font-family:var(--font-display);font-size:clamp(1.35rem,15cqi,1.95rem);line-height:1.05;letter-spacing:-.01em}
.kpi-foot{margin-top:var(--sp-2);display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--ink-3)}

/* ---- 8 · TABS (scrollable context) -------------------------------------- */
.tabs{position:relative}

<!-- ===================== APP SHELL ===================== -->
<div class="app" id="app">
  <!-- Workspace rail -->
  <aside class="rail" id="rail" aria-label="Workspaces">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg class="ic"><use href="#i-estate"/></svg></div>
      <div class="brand-text">
        <div class="brand-name">TerraVest</div>
        <div class="brand-sub">Financial OS</div>
      </div>
    </div>
    <nav class="rail-scroll scroll" id="railNav"></nav>
    <div class="rail-foot">
      <div class="who" tabindex="0" role="button" data-drawer="profile">
        <div class="avatar">AK</div>
        <div class="who-meta grow"><div class="who-name">Alex Kim</div><div class="who-role">Accredited investor</div></div>
        <svg class="ic ic-dots" style="color:var(--ink-3)"><use href="#i-dots"/></svg>
      </div>
    </div>
  </aside>

  <div class="main">
    <!-- Universal top bar -->
    <header class="topbar">
      <button class="iconbtn hamb" id="hamb" aria-label="Toggle navigation"><svg class="ic"><use href="#i-menu"/></svg></button>
      <button class="iconbtn" id="collapse" aria-label="Collapse rail" title="Collapse"><svg class="ic"><use href="#i-list"/></svg></button>
      <button class="omnibar" id="omni" aria-haspopup="dialog"><svg class="ic"><use href="#i-search"/></svg><span class="grow" style="text-align:left">Search accounts, transactions, actions…</span><span class="kbd">⌘K</span></button>
      <div class="mla row gap-2">
        <button class="fresh" id="syncBtn" title="Data as of just now — click to sync" aria-label="Data freshness — sync now"><span class="dot"></span><span id="freshTxt">Synced just now</span></button>
        <button class="iconbtn" id="privBtn" aria-label="Privacy mode" aria-pressed="false" title="Privacy mode — hide balances"><svg class="ic"><use href="#i-eye"/></svg></button>
        <button class="iconbtn" id="connBtn" aria-label="Connection health" title="Connection health"><svg class="ic"><use href="#i-plug"/></svg></button>
        <div class="seg icons" role="group" aria-label="Theme">
          <button data-theme-set="light" title="Light" aria-label="Light theme"><svg class="ic"><use href="#i-sun"/></svg></button>
          <button data-theme-set="dark" title="Dark" aria-label="Dark theme"><svg class="ic"><use href="#i-moon"/></svg></button>
          <button data-theme-set="system" title="System" aria-label="System theme"><svg class="ic"><use href="#i-monitor"/></svg></button>
        </div>
        <button class="iconbtn" aria-label="Help"><svg class="ic"><use href="#i-help"/></svg></button>
        <button class="iconbtn" id="notif" data-nav="messages" aria-label="Notifications — open Messages"><svg class="ic"><use href="#i-bell"/></svg><span class="ping"></span></button>

/* navigate accepts either a primary hub id or any sub-workspace id (deep links,

function applyRoute(target){
  let hub, sub;
  if (HUB[target]) { hub = HUB[target]; sub = hub.tabs ? hub.tabs[0].id : target; }
  else if (HUB_OF[target]) { hub = HUB[HUB_OF[target]]; sub = target; }
  else { hub = null; sub = target; }
  CURRENT_HUB = hub ? hub.id : null;
  renderHub(hub, sub);

/* deep-linking + browser history: every workspace & entity is a shareable URL */
function pushRoute(id){ const u = '#/'+id; if (location.hash !== u) history.pushState({id}, '', u); }
function navigate(target){ applyRoute(target); pushRoute(CURRENT); }
window.addEventListener('popstate', () => applyRoute((location.hash.slice(2)) || 'overview'));
function renderHub(hub, sub){
  const bar = $('#hubBar');
  if (hub && hub.tabs) {

/* ============================================================================
   4 · CHART ENGINE  (hand-rolled SVG, theme-aware, one palette)
   ============================================================================ */
function areaPath(vals,w,h,pad){
  const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1,n=vals.length;
  const X=i=>pad+(i/(n-1))*(w-2*pad), Y=v=>(h-pad)-((v-min)/rng)*(h-2*pad);
  let d=`M ${X(0)} ${Y(vals[0])}`;
  for(let i=1;i<n;i++){const x0=X(i-1),y0=Y(vals[i-1]),x1=X(i),y1=Y(vals[i]),cx=(x0+x1)/2; d+=` C ${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`;}
  return {line:d,X,Y,last:{x:X(n-1),y:Y(vals[n-1])}};
}
function sparkSVG(vals){
  const p=areaPath(vals,120,34,4), c=cssVar('--accent');
  return `<svg class="spark" viewBox="0 0 120 34" preserveAspectRatio="none" aria-hidden="true"><path d="${p.line} L 116 34 L 4 34 Z" fill="${c}" opacity=".13"/><path d="${p.line}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;
}
function donutSVG(segs,size,top,sub){
  size=size||150; const r=size/2, ir=r*0.62, cx=r, cy=r, total=segs.reduce((s,x)=>s+x.val,0)||1;
  let a=-Math.PI/2, out='';
  segs.forEach(s=>{ let f=s.val/total, a2=a+f*2*Math.PI; if(f>=.9999)a2=a+2*Math.PI-.001;
    const col=cssVar(s.color)||s.color, lg=f>.5?1:0;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const xi2=cx+ir*Math.cos(a2),yi2=cy+ir*Math.sin(a2),xi1=cx+ir*Math.cos(a),yi1=cy+ir*Math.sin(a);
    out+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${lg} 1 ${x2} ${y2} L${xi2} ${yi2} A${ir} ${ir} 0 ${lg} 0 ${xi1} ${yi1} Z" fill="${col}"/>`; a=a2; });
  const ctr=top?`<text x="${cx}" y="${cy-1}" text-anchor="middle" font-size="15" font-weight="700" fill="${cssVar('--ink')}" font-family="Georgia,serif">${top}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="9" fill="${cssVar('--ink-3')}">${sub||''}</text>`:'';
  const desc=segs.map(s=>`${s.label} ${Math.round(s.val/total*100)}%`).join(', ');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex-shrink:0" role="img" aria-label="Breakdown: ${desc}">${out}${ctr}</svg>`;
}
function inoutSVG(data){
  const w=560,h=170,pad=24,max=Math.max(...data.map(d=>Math.max(d.i,d.o)))*1.15;
  const pos=cssVar('--pos'),gold=cssVar('--gold'),tx=cssVar('--ink-3'),grid=cssVar('--border');
  let inner=`<line x1="0" y1="${h-pad}" x2="${w}" y2="${h-pad}" stroke="${grid}"/>`; const gw=(w-2*pad)/data.length;
  data.forEach((d,i)=>{const cx=pad+gw*i+gw/2;
    inner+=`<rect x="${cx-14}" y="${h-pad-(d.i/max)*(h-2*pad)}" width="12" height="${(d.i/max)*(h-2*pad)}" rx="4" fill="${pos}"/><rect x="${cx+2}" y="${h-pad-(d.o/max)*(h-2*pad)}" width="12" height="${(d.o/max)*(h-2*pad)}" rx="4" fill="${gold}"/><text x="${cx}" y="${h-6}" text-anchor="middle" font-size="10" fill="${tx}">${d.l}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Cash in vs out">${inner}</svg>`;
}
/* the net-worth command chart (area/line/bars) */
function nwSVG(vals, colorVar, type){
  const w=760,h=210,pad=26,color=cssVar(colorVar||'--c1'),grid=cssVar('--border'),tx=cssVar('--ink-3');
  let inner='';
  for(let g=0;g<4;g++){const y=pad+g*((h-2*pad)/3); inner+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="${grid}"/>`;}
  if(type==='bars'){
    const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)*1.1||1,n=vals.length,bw=Math.min(34,(w-2*pad)/n*0.6);
    vals.forEach((v,i)=>{const x=pad+(i/(n-1))*(w-2*pad)-bw/2,bh=((v-min)/rng)*(h-2*pad-8)+8; inner+=`<rect x="${x}" y="${h-pad-bh}" width="${bw}" height="${bh}" rx="5" fill="${color}" opacity="${0.5+0.45*(i/(n-1))}"/>`;});
  } else {
    const p=areaPath(vals,w,h,pad);
    if(type!=='line'){ inner+=`<defs><linearGradient id="nwg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".26"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${p.line} L ${p.last.x} ${h-pad} L ${pad} ${h-pad} Z" fill="url(#nwg)"/>`; }
    inner+=`<path d="${p.line}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1s var(--ease) forwards"/>`;
    inner+=`<circle cx="${p.last.x}" cy="${p.last.y}" r="5" fill="${color}"/><circle cx="${p.last.x}" cy="${p.last.y}" r="10" fill="none" stroke="${color}" stroke-width="1.5" opacity=".35"/>`;
  }
  ['Mar','Apr','May','Jun','Now'].forEach((l,i)=>{const x=pad+(i/4)*(w-2*pad); inner+=`<text x="${x}" y="${h-4}" text-anchor="middle" font-size="10" fill="${tx}">${l}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${inner}</svg>`;
}
/* declarative chart mounts */
function drawChartEl(el){
  const t=el.dataset.chart;
  if(t==='inout') el.innerHTML=inoutSVG(JSON.parse(el.dataset.v));
  else if(t==='donut'){ const s=JSON.parse(el.dataset.v); el.innerHTML=donutSVG(s,el.dataset.size?+el.dataset.size:150,el.dataset.top||'',el.dataset.sub||''); }
  else if(t==='nw') el.innerHTML=nwSVG(JSON.parse(el.dataset.v), el.dataset.color, el.dataset.type||'area');
  else if(t==='spark') el.innerHTML=sparkSVG(JSON.parse(el.dataset.v));
}

/* ---- selectors & scoping ------------------------------------------------- */
function bizFind(id){ return businessState.businesses.find(b=>b.id===id); }
function getSelectedBusiness(){ return businessState.selectedBusinessId==='all'?null:bizFind(businessState.selectedBusinessId); }
function bizBusinesses(){ return businessState.selectedBusinessId==='all'?businessState.businesses:[bizFind(businessState.selectedBusinessId)].filter(Boolean); }
function getBusinessScopedData(coll){ const id=businessState.selectedBusinessId; return id==='all'?coll:coll.filter(r=>r.businessId===id); }
function bizName(id){ const b=bizFind(id); return b?b.name:(id==='all'?'All businesses':'—'); }
function maskEin(ein){ return ein?'••-•••'+ein.slice(-4):'—'; }
function bizMoney(n,sign){ const neg=n<0; const s=neg?'−':(sign&&n>0?'+':''); return s+'$'+Math.abs(Math.round(n)).toLocaleString('en-US'); }
const BIZ_PERIODS=[['month','This month'],['quarter','This quarter'],['ytd','Year to date'],['ttm','Last 12 months'],['custom','Custom']];
const BIZ_PERIOD_MULT={month:1,quarter:3,ytd:7,ttm:12,custom:1};
function bizPeriodLabel(){ return ({month:'this month',quarter:'this quarter',ytd:'year to date',ttm:'last 12 months',custom:'custom range'})[businessState.selectedPeriod]; }

/* ---- derived aggregates -------------------------------------------------- */
function bizKpis(){ const list=bizBusinesses(); const m=BIZ_PERIOD_MULT[businessState.selectedPeriod]||1; const sum=k=>list.reduce((a,b)=>a+(b.kpi[k]||0),0);
  return { rev:sum('rev')*m, exp:sum('exp')*m, net:sum('net')*m, cash:sum('cash'), ar:sum('ar'), ap:sum('ap'), deposits:sum('deposits')*m }; }
function bizAging(){ const list=bizBusinesses(); const keys=['current','d1_30','d31_60','d61_90','over90']; const a={};
  keys.forEach(k=>a[k]=list.reduce((s,b)=>s+(b.aging[k]||0),0)); a.total=keys.reduce((s,k)=>s+a[k],0); return a; }
function bizCashflow(){ const list=bizBusinesses(); const months=['Jan','Feb','Mar','Apr','May','Jun'];
  return months.map((l,idx)=>{ let i=0,o=0; list.forEach(b=>{ const mm=b.cashflow[idx]; if(mm){i+=mm.i;o+=mm.o;} }); return {l,i:+i.toFixed(1),o:+o.toFixed(1)}; }); }

function bizSelect(key,opts){ return `<select class="finput" style="width:auto" data-bizfilter="${key}">${opts.map(o=>`<option value="${o[0]}"${businessState.filters[key]===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`; }
function bizEmpty(msg,icon,action){ return `<div class="empty" style="padding:var(--sp-6) var(--sp-4)"><div class="e-ic" style="width:46px;height:46px;font-size:21px;border-radius:var(--r-md);margin-bottom:var(--sp-3)">${I(icon||'search')}</div><p class="muted" style="max-width:36ch;margin:0 auto">${msg}</p>${action?`<div style="margin-top:var(--sp-4)">${action}</div>`:''}</div>`; }
function bizAttrCol(){ return businessState.selectedBusinessId==='all'; }

function renderBusinessWorkspace(){
  if(!businessState.businesses.length) return PAGES['business-onboarding']();
  const biz=getSelectedBusiness(), k=bizKpis();
  const count=businessState.businesses.length;
  const eyebrow=biz?'Business workspace':'Consolidated portfolio';
  const title=biz?biz.name:'All businesses';
  const sub=biz?`${biz.entity} · ${biz.industry} · EIN ${maskEin(biz.ein)}`:`${count} ${count===1?'business':'businesses'} · combined double-entry ledger across every entity`;
  return `${wshead(eyebrow,title,sub,
      `<button class="btn btn-outline btn-sm" data-bizact="sync">${I('refresh')} Sync</button><button class="btn btn-primary btn-sm" data-bizact="createInvoice">${I('plus')} New invoice</button>`)}
    <div class="biz-flow">
    ${bizBanner()}
    ${bizSelectorChips()}
    ${biz?bizProfileCard(biz):''}
    ${businessState.qbDismissed||(biz&&biz.integrations.quickbooks==='connected')?'':bizQbBanner()}
    ${bizHeroCard(k)}
    ${bizPeriodControl()}
    ${bizKpiRow(k)}
    ${bizPayablesAging()}
    ${bizCashflowCard()}
    ${biz?'':bizByBusinessCard()+bizBusinessesAccordion()}
    ${bizAccountsCard()}
    ${bizTabBar()}
    <div id="bizPanel">${bizPanelHTML()}</div>
    </div>`;
}

function bizBanner(){ if(businessState.bannerDismissed) return '';
  return `<div class="card" style="border-left:4px solid var(--pos);margin-bottom:var(--sp-4)"><div class="rowitem" style="border:0;padding:0"><div class="tile sm pos">${I('check')}</div><div class="grow"><div class="r-name" style="font-weight:500">Invoice for $6,200 to Northwind Co. created.</div></div><button class="iconbtn" data-bizact="dismissBanner" aria-label="Dismiss">${I('x')}</button></div></div>`; }

function bizSelectorChips(){ const cur=businessState.selectedBusinessId;
  const chip=(sel,active,inner,label)=>`<span class="chip${active?' active':''}" data-bizsel="${sel}" tabindex="0" role="button" aria-pressed="${!!active}" aria-label="${label}">${inner}</span>`;
  let c=`<div class="chiprow" style="margin-bottom:var(--sp-4)">${chip('all',cur==='all',I('grid')+' All businesses','View all businesses')}`;
  businessState.businesses.forEach(b=>c+=chip(b.id,cur===b.id,I(b.logo)+' '+b.name,'View '+b.name));
  c+=chip('add',false,I('plus')+' Add','Add a business')+`</div>`; return c; }

function bizProfileCard(b){ const intg=Object.entries(b.integrations).filter(([,v])=>v==='connected').map(([k])=>k);
  const row=(label,val)=>`<div><div class="sc-label">${label}</div><div style="font-weight:600;font-size:var(--fs-sm);margin-top:3px">${val}</div></div>`;
  return `<div class="card" style="margin-bottom:var(--sp-4)">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:var(--sp-3);flex-wrap:wrap">
      <div class="row gap-3" style="align-items:center"><div class="tile ${b.cls}">${I(b.logo)}</div><div><div class="r-name" style="font-weight:600">${b.legalName}${b.dba?` <span class="muted">· dba ${b.dba}</span>`:''}</div><div class="r-sub">${b.entity} · ${b.industry} · ${b.status} · Formed ${b.formationState}, ${b.formationDate}</div></div></div>
      <div class="row gap-2"><button class="btn btn-outline btn-sm" data-bizact="editBusiness" data-id="${b.id}">${I('tag')} Edit</button><button class="btn btn-outline btn-sm" data-bizact="settings">${I('settings')} Settings</button><button class="iconbtn" data-bizact="removeBusiness" data-id="${b.id}" aria-label="Remove business">${I('x')}</button></div>
    </div>
    <div class="grid g12" style="margin-top:var(--sp-4);row-gap:var(--sp-3)">
      ${[row('EIN',maskEin(b.ein)),row('Fiscal year',b.fiscalYearStart),row('Accounting',b.accountingMethod),row('Owner',b.owner)].map(r=>`<div class="c3">${r}</div>`).join('')}
    </div>
    <div class="row gap-2 wrap" style="margin-top:var(--sp-4);align-items:center">
      <span class="badge pos">${I('refresh')} Synced ${b.lastSync}</span>
      ${intg.length?intg.map(x=>`<span class="badge neutral">${I('link2')} ${x[0].toUpperCase()+x.slice(1)}</span>`).join(''):'<span class="badge gold">No integrations connected</span>'}
      <span class="muted" style="font-size:var(--fs-xs);margin-left:auto">${b.address} · ${b.phone}</span>
    </div></div>`; }

function bizQbBanner(){ return `<div class="card" style="border-left:4px solid var(--gold);margin-bottom:var(--sp-4);display:flex;align-items:center;gap:var(--sp-3)">${I('link2')}<div class="grow" style="font-size:var(--fs-sm)"><strong>Connect QuickBooks</strong> <span class="badge neutral">optional</span> — only to auto-sync revenue, expenses and invoices. Manual &amp; linked tracking works without it.</div><button class="btn btn-outline btn-sm" data-bizact="connectQuickBooks">Connect</button><button class="iconbtn" data-bizact="dismissQb" aria-label="Dismiss">${I('x')}</button></div>`; }

function bizHeroCard(k){ return `<div class="card" style="border-left:4px solid var(--accent);margin-bottom:var(--sp-6);display:flex;flex-wrap:wrap;gap:var(--sp-6);align-items:flex-end;justify-content:space-between">
    <div><div class="eyebrow">Total business cash</div><div class="num" style="font-family:var(--font-display);font-size:2.2rem">${bizMoney(k.cash)}</div><div class="muted" style="font-size:var(--fs-xs)">${bizBusinesses().length} ${bizBusinesses().length===1?'business':'businesses'} · ${bizMoney(k.ap)} owed</div></div>
    <div class="row gap-6 wrap"><div><div class="eyebrow">Net position</div><div class="num" style="font-weight:700;color:var(--pos)">${bizMoney(k.cash-k.ap)}</div></div><div><div class="eyebrow">Deposits · ${bizPeriodLabel()}</div><div class="num" style="font-weight:700">${bizMoney(k.deposits)}</div></div><div><div class="eyebrow">Net cash flow · ${bizPeriodLabel()}</div><div class="num" style="font-weight:700;color:var(--pos)">${bizMoney(k.net,true)}</div></div></div></div>`; }

function bizPeriodControl(){ return `<div class="chiprow" style="margin-bottom:var(--sp-4)"><span class="muted" style="font-size:var(--fs-xs);font-weight:600;align-self:center">${I('cal')} Period</span>${BIZ_PERIODS.map(p=>`<span class="chip${businessState.selectedPeriod===p[0]?' active':''}" data-bizperiod="${p[0]}">${p[1]}</span>`).join('')}</div>`; }

function bizKpiRow(k){ return `<div class="kpirow" style="margin-bottom:var(--sp-6)">
    ${kpi('arr-ur','pos','Revenue',bizMoney(k.rev),bizPeriodLabel())}
    ${kpi('arr-dr','neg','Expenses',bizMoney(k.exp),bizPeriodLabel())}
    ${kpi('trend','','Net profit',bizMoney(k.net),bizPeriodLabel())}
    ${kpi('invoice','gold','Outstanding (AR)',bizMoney(k.ar),'as of today')}
    ${kpi('receipt','neg','Bills due (AP)',bizMoney(k.ap),'as of today')}
  </div>`; }

function bizPayablesAging(){ const a=bizAging(); const pct=v=>a.total?Math.round(v/a.total*100):0;
  const row=(color,label,val)=>`<div class="row" style="justify-content:space-between;padding:5px 0"><span class="legend-item"><span class="legend-dot" style="background:var(${color})"></span> ${label}</span><span class="row gap-3"><span class="muted" style="font-size:var(--fs-xs)">${pct(val)}%</span><span class="num">${bizMoney(val)}</span></span></div>`;
  const overdue=a.d1_30+a.d31_60+a.d61_90+a.over90;
  return `<div class="card" style="margin-bottom:var(--sp-6)">${sechead('Payables aging '+(overdue>0?`<span class="badge neg">${bizMoney(overdue)} overdue</span>`:'<span class="badge pos">All current</span>'),`<button class="btn btn-ghost btn-sm" data-biztab="bills">Bills &amp; AP ${I('arr-r')}</button>`)}
    ${stackBar([{pct:pct(a.current),color:'--pos'},{pct:pct(a.d1_30),color:'--gold'},{pct:pct(a.d31_60),color:'--gold'},{pct:pct(a.d61_90),color:'--neg'},{pct:pct(a.over90),color:'--neg'}])}
    <div style="margin-top:10px">${row('--pos','Current',a.current)}${row('--gold','1–30 days',a.d1_30)}${row('--gold','31–60 days',a.d31_60)}${row('--neg','61–90 days',a.d61_90)}${row('--neg','90+ days',a.over90)}</div>
    <div class="flow-row strong" style="border-top:2px solid var(--border);margin-top:6px"><span>Total outstanding</span><span class="num">${bizMoney(a.total)}</span></div></div>`; }

function bizCashflowCard(){ const cf=bizCashflow(); const k=bizKpis();
  return `<div class="card" style="margin-bottom:var(--sp-6)">${sechead('Cash flow · last 6 months',`<span class="badge pos">Net ${bizMoney(k.net,true)}</span>`)}<div data-chart="inout" data-v='${JSON.stringify(cf)}'></div></div>`; }

function bizByBusinessCard(){ const rows=businessState.businesses.map(b=>`<tr data-drawer="business" data-id="${b.id}" style="cursor:pointer"><td><strong>${b.name}</strong><div class="r-sub muted">${b.industry}</div></td><td${RT}><span class="num">${bizMoney(b.kpi.rev)}</span></td><td${RT}><span class="num" style="color:var(--neg)">${bizMoney(b.kpi.exp)}</span></td><td${RT}><span class="num" style="color:var(--pos)">${bizMoney(b.kpi.net)}</span></td><td${RT}><span class="num">${bizMoney(b.kpi.cash)}</span></td><td${RT}><span class="num">${bizMoney(b.kpi.ar)}</span></td></tr>`).join('');
  const t=businessState.businesses.reduce((a,b)=>({rev:a.rev+b.kpi.rev,exp:a.exp+b.kpi.exp,net:a.net+b.kpi.net,cash:a.cash+b.kpi.cash,ar:a.ar+b.kpi.ar}),{rev:0,exp:0,net:0,cash:0,ar:0});
  return `<div class="card" style="margin-bottom:var(--sp-6)">${sechead('By business','<span class="badge neutral">This month</span>')}
    ${bizTable(`<th>Business</th><th${RT}>Revenue</th><th${RT}>Expenses</th><th${RT}>Net</th><th${RT}>Cash</th><th${RT}>Outstanding</th>`,rows+`<tr style="font-weight:700;border-top:2px solid var(--border)"><td>All businesses</td><td${RT}><span class="num">${bizMoney(t.rev)}</span></td><td${RT}><span class="num">${bizMoney(t.exp)}</span></td><td${RT}><span class="num">${bizMoney(t.net)}</span></td><td${RT}><span class="num">${bizMoney(t.cash)}</span></td><td${RT}><span class="num">${bizMoney(t.ar)}</span></td></tr>`)}</div>`; }

function bizBusinessesAccordion(){ const exp=businessState.expandedBusinessIds;
  const cards=businessState.businesses.map(b=>{ const open=exp.includes(b.id); const accts=businessState.accounts.filter(a=>a.businessId===b.id);
    const txns=businessState.transactions.filter(t=>t.businessId===b.id).slice(0,2);
    return `<details class="acc"${open?' open':''}><summary>${I('chev-r','acc-chev muted')}<div class="tile sm ${b.cls}">${I(b.logo)}</div><div class="grow"><div class="r-name">${b.name}</div><div class="r-sub">${b.entity} · ${b.industry} · ${accts.length} accounts</div></div><div style="text-align:right"><div class="num" style="font-weight:700">${bizMoney(b.kpi.cash)}</div><div class="r-sub">Net <span style="color:var(--pos)">${bizMoney(b.kpi.net,true)}</span> · this month</div></div></summary>
      <div class="acc-body">
        <div class="kpirow" style="margin-bottom:var(--sp-3)">${kpi('arr-ur','pos','Revenue',bizMoney(b.kpi.rev),'')}${kpi('arr-dr','neg','Expenses',bizMoney(b.kpi.exp),'')}${kpi('bank','info','Cash',bizMoney(b.kpi.cash),'')}${kpi('invoice','gold','Outstanding',bizMoney(b.kpi.ar),'')}</div>
        <div class="eyebrow" style="margin:var(--sp-3) 0 var(--sp-2)">Connected accounts</div>
        <div class="rowlist">${accts.map(a=>richRow({icon:a.type==='Credit Card'?'card':a.type==='Savings'?'pig':'bank',cls:a.balance<0?'gold':'',name:a.name,sub:a.institution+' · '+a.type,amt:bizMoney(a.balance),amtColor:a.balance<0?'var(--neg)':''})).join('')}</div>
        <div class="eyebrow" style="margin:var(--sp-4) 0 var(--sp-2)">Recent transactions</div>
        <div class="rowlist">${txns.map(t=>richRow({icon:t.amount>0?'arr-dl':'arr-ur',cls:t.amount>0?'pos':'neg',name:t.desc,sub:t.category+' · '+t.date,amt:bizMoney(t.amount,true),amtColor:t.amount>0?'var(--pos)':''})).join('')||bizEmpty('No transactions.')}</div>
        <div class="row gap-2 wrap" style="margin-top:var(--sp-4)">
          <button class="btn btn-outline btn-sm" data-drawer="business" data-id="${b.id}">${I('arr-r')} View business</button>
          <button class="btn btn-ghost btn-sm" data-bizact="editBusiness" data-id="${b.id}">${I('tag')} Edit</button>
          <button class="btn btn-ghost btn-sm" data-bizact="addTransaction" data-id="${b.id}">${I('plus')} Transaction</button>
          <button class="btn btn-ghost btn-sm" data-bizact="addExpense" data-id="${b.id}">${I('receipt')} Expense</button>
          <button class="btn btn-ghost btn-sm" data-bizact="createInvoice" data-id="${b.id}">${I('invoice')} Invoice</button>
          <button class="btn btn-ghost btn-sm" data-bizact="addBill" data-id="${b.id}">${I('receipt')} Bill</button>
          <button class="btn btn-ghost btn-sm" data-bizact="uploadDocument" data-id="${b.id}">${I('download')} Document</button>
        </div></div></details>`; }).join('');
  return `<div class="card" style="margin-bottom:var(--sp-6)">${sechead('Businesses <span class="badge neutral">'+businessState.businesses.length+'</span>',`<div class="row gap-2"><button class="btn btn-outline btn-sm" data-bizexpand="all">Expand all</button><button class="btn btn-outline btn-sm" data-bizexpand="none">Collapse all</button></div>`)}${cards}</div>`; }

function bizAccountsCard(){ const accts=getBusinessScopedData(businessState.accounts);
  const badge=s=>({connected:['Connected','pos'],manual:['Manual','neutral'],'needs-attention':['Needs attention','gold'],syncing:['Syncing','warn'],disconnected:['Disconnected','neg']})[s]||['—','neutral'];
  const cards=accts.map(a=>`<div class="acct-card" data-bizact="editAccount" data-id="${a.id}" style="cursor:pointer"><div class="acct-top"><div class="tile ${a.balance<0?'gold':''}">${I(a.type==='Credit Card'?'card':a.type==='Savings'?'pig':'bank')}</div><div class="grow"><div class="acct-name">${a.name}</div><div class="acct-inst">${a.institution}</div></div>${a.primary?'<span class="badge pos" style="font-size:10px">Primary</span>':''}</div><div class="acct-bal num"${a.balance<0?' style="color:var(--neg)"':''}>${bizMoney(a.balance)}</div><div class="row" style="justify-content:space-between;align-items:center;margin-top:6px"><span class="acct-meta">${a.type}${a.limit?' · '+Math.round(Math.abs(a.balance)/a.limit*100)+'% used':''}</span>${bb(badge(a.status))}</div></div>`).join('');
  return `<div class="card" style="margin-bottom:var(--sp-6)">${sechead('Connected accounts','<div class="row gap-2"><button class="btn btn-outline btn-sm" data-bizact="addManualAccount">'+I('plus')+' Manual</button><button class="btn btn-primary btn-sm" data-bizact="linkAccount">'+I('link2')+' Link</button></div>')}
    <p class="muted" style="font-size:var(--fs-xs);margin:-6px 0 10px">${I('refresh')} Business accounts are auto-detected and sync automatically.</p>
    ${accts.length?carousel(cards):bizEmpty('No business accounts linked yet — link a bank, card or loan to auto-track cash.','bank','<button class="btn btn-primary btn-sm" data-bizact="linkAccount">'+I('link2')+' Link account</button>')}</div>`; }

function panelOverview(){ const k=bizKpis(); const inv=getBusinessScopedData(businessState.invoices);
  const ar=inv.filter(i=>i.status!=='paid'&&i.status!=='void');
  const vend=getBusinessScopedData(businessState.vendors).slice().sort((a,b)=>b.spend-a.spend).slice(0,4); const maxSpend=vend.length?vend[0].spend:1;
  const act=getBusinessScopedData(businessState.activities).slice(0,4);
  return `<div class="grid g12">
    <div class="card c6">${sechead('P&amp;L snapshot','<span class="badge neutral">'+bizPeriodLabel()+'</span>')}<div class="rowlist">
      ${richRow({icon:'arr-dl',cls:'pos',name:'Income',sub:'Revenue',amt:bizMoney(k.rev),amtColor:'var(--pos)'})}
      ${richRow({icon:'arr-ur',cls:'neg',name:'Expenses',sub:'Operating',amt:bizMoney(k.exp),amtColor:'var(--neg)'})}
      ${richRow({icon:'scale',cls:'',name:'Net profit',sub:bizPeriodLabel(),amt:bizMoney(k.net),amtColor:'var(--pos)'})}
    </div></div>
    <div class="card c6">${sechead('Top vendors','<span class="badge neutral">By spend</span>')}
      ${vend.length?vend.map(v=>`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between;font-size:var(--fs-sm);margin-bottom:3px"><span style="font-weight:500">${v.name}</span><span class="num" style="font-weight:700">${bizMoney(v.spend)}</span></div><div class="minibar"><i style="width:${Math.round(v.spend/maxSpend*100)}%;background:var(--accent)"></i></div></div>`).join(''):bizEmpty('No vendors.')}</div>
    <div class="card c6">${sechead('Accounts receivable','<button class="btn btn-outline btn-sm" data-bizact="createInvoice">'+I('invoice')+' New invoice</button>')}<div class="rowlist">
      ${ar.length?ar.map(i=>richRow({icon:'invoice',cls:i.status==='overdue'?'neg':'gold',name:i.customer,sub:bb(INV_STATUS[i.status])+' · due '+i.due,amt:bizMoney(i.amount-i.paid)})).join(''):bizEmpty('Nothing outstanding — all receivables are collected.','check')}</div></div>
    <div class="card c6">${sechead('Recent activity','<button class="btn btn-ghost btn-sm" data-biztab="activity">All '+I('arr-r')+'</button>')}<div class="rowlist">
      ${act.map(a=>richRow({icon:'repeat',cls:a.status==='pending'?'gold':'',name:a.action,sub:a.record+' · '+a.user,amt:''})).join('')}</div></div>
    <div class="card c12" style="border-left:4px solid var(--accent);display:flex;gap:var(--sp-3);align-items:center">${I('sparkles')}<div style="font-size:var(--fs-sm)"><strong>Advisor:</strong> ${getSelectedBusiness()?getSelectedBusiness().name:'Your portfolio'} is cash-flow positive ${bizPeriodLabel()}. One invoice is 12 days overdue — a reminder now typically recovers payment within a week.</div><button class="btn btn-ghost btn-sm mla" data-nav="ai">Discuss ${I('arr-r')}</button></div>
  </div>`; }

function panelTransactions(){ const f=businessState.filters; let rows=getBusinessScopedData(businessState.transactions);
  if(f.txnDir!=='all') rows=rows.filter(t=>t.dir===f.txnDir);
  if(f.txnStatus!=='all') rows=rows.filter(t=>t.status===f.txnStatus);
  const tin=rows.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0), tout=rows.filter(t=>t.amount<0).reduce((a,t)=>a-t.amount,0);
  const dirs=[['all','All'],['in','Money in'],['out','Money out'],['transfer','Transfers']];
  const attr=bizAttrCol();
  const body=rows.length?rows.map(t=>`<tr><td><strong>${t.desc}</strong>${attr?`<div class="r-sub muted">${bizName(t.businessId)}</div>`:''}</td><td>${t.account}</td><td>${t.category}</td><td>${bb([t.type,'info'])}</td><td>${bb(TXN_STATUS[t.status])}</td><td class="muted">${t.date}</td><td${RT}><span class="num"${t.amount>0?' style="color:var(--pos)"':''}>${bizMoney(t.amount,true)}</span></td><td${RT}>${iacts(iact('search','viewTxn',t.id,'View'),iact('tag','recatTxn',t.id,'Categorize'),iact('link2','linkTxn',t.id,'Link'),iact('check','reconcileTxn',t.id,'Reconcile'))}</td></tr>`).join(''):`<tr><td colspan="8">${bizEmpty('No transactions match these filters.')}</td></tr>`;

function bizDrawerShow(icon,title,sub,bodyHtml){
  $('#drawerIcon').className='tile'; $('#drawerIcon').innerHTML=I(icon);
  $('#drawerTitle').textContent=title; $('#drawerSub').textContent=sub;
  const tabsEl=$('#drawerTabs'); if(tabsEl) tabsEl.style.display='none';
  const body=$('#drawerBody'); body.__panels=null; body.innerHTML=bodyHtml;
  lastFocused=document.activeElement; drawer.classList.add('show'); scrim.classList.add('show');

/* ============================================================================
   EVENT HANDLERS (delegated, business-scoped attributes only)
   ============================================================================ */
function bizHandleAction(action,el){
  const id=el.getAttribute('data-id');
  switch(action){
    case 'dismissBanner': businessState.bannerDismissed=true; rerenderBusiness(); return;
    case 'dismissQb': businessState.qbDismissed=true; rerenderBusiness(); return;
    case 'sync': toast('All accounts synced','check'); return;
    case 'connectQuickBooks': { const b=getSelectedBusiness(); if(b) b.integrations.quickbooks='connected'; businessState.qbDismissed=true; toast('QuickBooks connected','check'); rerenderBusiness(); return; }
    case 'linkAccount': case 'addManualAccount': openDrawer('link'); return;
    case 'editAccount': openBizDrawer('account',id); return;
    case 'settings': businessState.activeTab='settings'; if(!getSelectedBusiness()) businessState.selectedBusinessId=businessState.businesses[0].id; rerenderBusiness(); return;
    case 'createInvoice': openBizDrawer('invoice',id); return;
    case 'addTransaction': openBizDrawer('transaction',id); return;
    case 'addExpense': openBizDrawer('expense',id); return;
    case 'addBill': openBizDrawer('bill',id); return;
    case 'addCustomer': openBizDrawer('customer',id); return;
    case 'addVendor': openBizDrawer('vendor',id); return;
    case 'uploadDocument': case 'addDocLink': openBizDrawer('document',id); return;
    case 'newPO': openBizDrawer('bill',id); toast('Draft a PO for a vendor',I('list')); return;
    case 'newQuote': openBizDrawer('invoice',id); return;
    case 'newProject': toast('New project — add customer & budget','trend'); return;
    case 'newRecurring': openBizDrawer('invoice',id); return;
    case 'editBusiness': openBizDrawer('business',id); return;
    case 'addBusiness': openBizDrawer('business'); return;
    case 'taxRates': case 'addTaxRate': openBizDrawer('taxRates'); return;
    case 'linkTxn': openDrawer('txnlink'); return;
    case 'exportExpenses': openDrawer('expexport'); return;
    case 'inviteMember': openBizDrawer('invite'); return;
    case 'permissionsMatrix': case 'managePermissions': case 'viewRole': openBizDrawer('permissions',id); return;
    case 'changeRole': openBizDrawer('role',id); return;
    case 'configIntegration': toast('Opening integration settings','link2'); return;
    case 'txnRules': toast('Categorization rules','filter'); return;
    case 'saveReportDoc': toast('Report saved to Documents','folder'); return;
    case 'exportStatement': downloadBizCsv('statement'); return;
    case 'exportCsv': downloadBizCsv(el.getAttribute('data-coll')); return;
    case 'viewTxn': { const t=businessState.transactions.find(x=>x.id===id); if(t) toast('Opening '+t.desc,'search'); return; }
    case 'viewInvoice': { const i=businessState.invoices.find(x=>x.id===id); if(i) toast('Opening invoice for '+i.customer,'search'); return; }
    case 'downloadInvoice': toast('Invoice downloaded','download'); return;
    case 'sendInvoice': toast('Invoice sent','link2'); return;
    case 'downloadDoc': toast('Downloading document','download'); return;
    case 'previewDoc': toast('Opening preview','search'); return;
    case 'recatTxn': toast('Recategorize transaction','tag'); return;
    case 'reconcileTxn': { const t=businessState.transactions.find(x=>x.id===id); if(t){ t.status='reconciled'; toast('Marked reconciled','check'); rerenderBizPanel(); } return; }
    case 'approveExp': { const e=businessState.expenses.find(x=>x.id===id); if(e){ e.status='approved'; toast('Expense approved','check'); rerenderBizPanel(); } return; }
    case 'editExp': openBizDrawer('expense',id); return;
    case 'editBill': openBizDrawer('bill',id); return;
    case 'editCustomer': openBizDrawer('customer',id); return;
    case 'editVendor': openBizDrawer('vendor',id); return;
    case 'deleteExp': bizConfirm('Delete expense','This removes the expense from tracking.','Delete',()=>{ businessState.expenses=businessState.expenses.filter(x=>x.id!==id); toast('Expense deleted','x'); rerenderBizPanel(); }); return;
    case 'deleteDoc': bizConfirm('Delete document','This removes the document from this business.','Delete',()=>{ businessState.documents=businessState.documents.filter(x=>x.id!==id); toast('Document deleted','x'); rerenderBizPanel(); }); return;

function downloadBizCsv(coll){
  const map={
    transactions:{name:'transactions',head:['Business','Date','Description','Account','Category','Type','Status','Amount'],rows:()=>getBusinessScopedData(businessState.transactions).map(t=>[bizName(t.businessId),t.date,t.desc,t.account,t.category,t.type,t.status,t.amount])},
    bills:{name:'bills',head:['Business','Vendor','Category','Amount','Paid','Due','Status'],rows:()=>getBusinessScopedData(businessState.bills).map(b=>[bizName(b.businessId),b.vendor,b.category,b.amount,b.paid,b.due,b.status])},
    customers:{name:'customers',head:['Business','Name','Email','Tax ID','Pays by','Terms','Outstanding','Lifetime'],rows:()=>getBusinessScopedData(businessState.customers).map(c=>[bizName(c.businessId),c.name,c.email,c.taxId,c.pays,c.terms,c.outstanding,c.lifetime])},
    vendors:{name:'vendors',head:['Business','Name','Email','Category','Terms','Open bills','Total spend'],rows:()=>getBusinessScopedData(businessState.vendors).map(v=>[bizName(v.businessId),v.name,v.email,v.category,v.terms,v.outstanding,v.spend])},
    activities:{name:'activity',head:['When','User','Action','Record','Business','Status'],rows:()=>getBusinessScopedData(businessState.activities).map(a=>[a.ts,a.user,a.action,a.record,bizName(a.businessId),a.status])},
    statement:{name:'profit-and-loss',head:['Line','Amount'],rows:()=>{ const k=bizKpis(); return [['Sales Income',k.rev],['Operating Expenses',k.exp],['Net profit',k.net]]; }},
  };
  const c=map[coll]||map.transactions; const label=(getSelectedBusiness()?getSelectedBusiness().name:'all-businesses').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  downloadCSV(`${label}-${c.name}.csv`,c.head,c.rows()); toast('CSV exported','download');
}
function downloadCSV(filename,header,rows){
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv=[header.map(esc).join(','),...rows.map(r=>r.map(esc).join(','))].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* accessibility: focus trap + restore for overlays (drawer, command palette) */
let lastFocused=null;
function trapFocus(container){
  const sel='a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
  const onKey=e=>{ if(e.key!=='Tab')return; const f=[...container.querySelectorAll(sel)].filter(el=>el.offsetParent!==null); if(!f.length)return; const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();} else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();} };
  container.__trap=onKey; container.addEventListener('keydown',onKey);
}
function releaseFocus(container){ if(container.__trap){ container.removeEventListener('keydown',container.__trap); container.__trap=null; } }
function restoreFocus(){ if(lastFocused&&lastFocused.focus){ try{lastFocused.focus();}catch(e){} } }

    $('#drawerIcon').innerHTML=I(d.icon); $('#drawerTitle').textContent=d.title; $('#drawerSub').textContent=d.sub;
    const tabs=['Overview', ...(d.tl?['Activity']:[]),'Documents','Notes','Related','AI'];
    tabsEl.style.display=''; tabsEl.setAttribute('role','tablist'); drawerTabState=0;
    tabsEl.innerHTML=tabs.map((t,i)=>`<button class="drawer-tab${i===0?' active':''}" data-dtab="${i}" role="tab" aria-selected="${i===0}">${t}</button>`).join('');
    const panels={0:d.overview};
    let k=1; if(d.tl){panels[k]=`<div class="card">${sechead('Activity')}${timeline(TIMELINES[d.tl]||[])}</div>`; k++;}
    panels[k]=`<div class="card">${sechead('Documents')}${docRows()}</div>`; k++;
    panels[k]=notesPanel(); k++;
    panels[k]=relatedPanel(type); k++;
    panels[k]=d.ai;
    body.dataset.panels=JSON.stringify(Object.keys(panels));
    body.__panels=panels;
    body.innerHTML=panels[0];
  }
  lastFocused=document.activeElement;
  drawer.classList.add('show'); scrim.classList.add('show');
  body.querySelectorAll('[data-chart]').forEach(drawChartEl);
  trapFocus(drawer);
  setTimeout(()=>{ const f=drawer.querySelector('[data-close-drawer]'); if(f) f.focus(); }, 60);
}
function closeDrawer(){ if(!drawer.classList.contains('show'))return; drawer.classList.remove('show'); releaseFocus(drawer); if(!$('#cmdk').classList.contains('show')) scrim.classList.remove('show'); restoreFocus(); }

/* ============================================================================
   9 · CAROUSELS
   ============================================================================ */
function initCarousel(car){
  const track=car.querySelector('.carousel-track');
  const update=()=>{ car.dataset.start=track.scrollLeft<=2; car.dataset.end=track.scrollLeft+track.clientWidth>=track.scrollWidth-2; };
  track.addEventListener('scroll',update,{passive:true});
  car.querySelectorAll('[data-arrow]').forEach(b=>b.addEventListener('click',()=>track.scrollBy({left:parseInt(b.dataset.arrow)*Math.min(track.clientWidth*0.8,560),behavior:'smooth'})));
  track.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){track.scrollBy({left:280,behavior:'smooth'});e.preventDefault();} if(e.key==='ArrowLeft'){track.scrollBy({left:-280,behavior:'smooth'});e.preventDefault();} });
  new ResizeObserver(update).observe(track); update();
}

/* ============================================================================
   10 · AI ADVISOR auto-rotate
   ============================================================================ */
let aiTimer=null, aiIdx=0, aiPlaying=true;
function aiTrackEl(){ const d=$('#aiDots'); return d?d.previousElementSibling.querySelector('.carousel-track'):null; }
function buildAiDots(){
  const dots=$('#aiDots'); if(!dots) return;
  dots.innerHTML=AI.map((_,i)=>`<button aria-label="Card ${i+1}" data-dot="${i}"></button>`).join('');
  aiIdx=0; [...dots.children].forEach((d,i)=>d.classList.toggle('active',i===0));
}
function aiGo(i){ const tr=aiTrackEl(); if(!tr) return; aiIdx=(i+AI.length)%AI.length; const c=tr.children[aiIdx]; if(c) tr.scrollTo({left:c.offsetLeft-tr.offsetLeft,behavior:'smooth'}); const dots=$('#aiDots'); if(dots)[...dots.children].forEach((d,di)=>d.classList.toggle('active',di===aiIdx)); }
function startAi(){ if(aiTimer)clearInterval(aiTimer); aiTimer=setInterval(()=>{ if(aiPlaying)aiGo(aiIdx+1); },6000); }

/* ============================================================================
   11 · STICKY SUMMARY shadow
   ============================================================================ */
let summaryObs=null;
function wireSummary(){
  const bar=$('#summary'); if(!bar) return;
  if(summaryObs) summaryObs.disconnect();
  const sent=document.createElement('div'); sent.setAttribute('aria-hidden','true'); sent.style.cssText='height:1px;margin-bottom:-1px';
  bar.parentNode.insertBefore(sent,bar);
  summaryObs=new IntersectionObserver(([e])=>bar.classList.toggle('stuck',!e.isIntersecting),{root:viewport,threshold:0});
  summaryObs.observe(sent);
}

/* ============================================================================
   12 · COMMAND PALETTE
   ============================================================================ */
const cmdk=$('#cmdk'), cmdkInput=$('#cmdkInput'), cmdkList=$('#cmdkList');
const CMDS=[
  ...NAV.flatMap(h => h.tabs ? h.tabs.map(t=>({type:'Go to',label:t.label,icon:t.icon||h.icon,hint:h.label,run:()=>navigate(t.id)})) : [{type:'Go to',label:h.label,icon:h.icon,hint:'Workspace',run:()=>navigate(h.id)}]),
  ...ACCOUNTS.map(a=>({type:'Open',label:a.name,icon:a.icon,hint:a.inst,run:()=>openDrawer('account',a.id)})),
  {type:'Action',label:'Link an account',icon:'bank',hint:'⌘N',run:()=>openDrawer('link')},
  {type:'Action',label:'Create a goal',icon:'target',run:()=>openDrawer('goal')},
  {type:'Action',label:'Ask the advisor',icon:'robot',run:()=>navigate('ai')},
  {type:'Action',label:'Component gallery (dev)',icon:'grid',run:()=>navigate('components')},
  {type:'Action',label:'Toggle theme',icon:'moon',run:()=>{themePref=root.getAttribute('data-theme')==='dark'?'light':'dark';applyTheme(themePref);}},
];
let cmdkActive=0, cmdkFiltered=CMDS;
function renderCmdk(q=''){
  cmdkFiltered=CMDS.filter(c=>(c.type+' '+c.label+' '+(c.hint||'')).toLowerCase().includes(q.toLowerCase())); cmdkActive=0;
  let html='',last='';
  cmdkFiltered.forEach((c,i)=>{ if(c.type!==last){html+=`<div class="cmdk-grp">${c.type}</div>`;last=c.type;} html+=`<div class="cmdk-item${i===0?' active':''}" data-i="${i}">${I(c.icon)}<span>${c.label}</span>${c.hint?`<span class="cmdk-hint">${c.hint}</span>`:''}</div>`; });
  cmdkList.innerHTML=html||`<div class="empty" style="padding:var(--sp-6)"><p>No matches</p></div>`;
}
function openCmdk(){ if(!cmdk.classList.contains('show')) lastFocused=document.activeElement; renderCmdk(); cmdk.classList.add('show'); scrim.classList.add('show'); cmdkInput.value=''; cmdkInput.focus(); trapFocus(cmdk); }
function closeCmdk(){ if(!cmdk.classList.contains('show'))return; cmdk.classList.remove('show'); releaseFocus(cmdk); if(!drawer.classList.contains('show')){ scrim.classList.remove('show'); restoreFocus(); } }
function runCmdk(i){ const c=cmdkFiltered[i]; if(c){ closeCmdk(); c.run(); } }
$('#omni').addEventListener('click',openCmdk);
cmdkInput.addEventListener('input',e=>renderCmdk(e.target.value));
cmdkList.addEventListener('click',e=>{ const it=e.target.closest('[data-i]'); if(it)runCmdk(+it.dataset.i); });
cmdkInput.addEventListener('keydown',e=>{
  const items=[...cmdkList.querySelectorAll('.cmdk-item')];
  if(e.key==='ArrowDown'){cmdkActive=Math.min(cmdkActive+1,items.length-1);e.preventDefault();}
  else if(e.key==='ArrowUp'){cmdkActive=Math.max(cmdkActive-1,0);e.preventDefault();}
  else if(e.key==='Enter'){runCmdk(cmdkActive);return;} else return;
  items.forEach((it,i)=>it.classList.toggle('active',i===cmdkActive)); items[cmdkActive]?.scrollIntoView({block:'nearest'});
});

/* ============================================================================
   13 · THEME
   ============================================================================ */
const root=document.documentElement, mq=window.matchMedia('(prefers-color-scheme:dark)');
function applyTheme(mode){
  const eff=mode==='system'?(mq.matches?'dark':'light'):mode;
  root.setAttribute('data-theme',eff);
  $$('[data-theme-set]').forEach(b=>b.classList.toggle('active',b.dataset.themeSet===mode));
  try{localStorage.setItem('tv3-theme',mode);}catch(e){}
  if(BOOTED) rerender();
}
let themePref=(()=>{try{return localStorage.getItem('tv3-theme')||'system';}catch(e){return 'system';}})();
$$('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>{themePref=b.dataset.themeSet;applyTheme(themePref);}));
mq.addEventListener('change',()=>{ if(themePref==='system') applyTheme('system'); });

/* ============================================================================
   14 · SHELL WIRING + GLOBAL DELEGATION
   ============================================================================ */
$('#collapse').addEventListener('click',()=>app.classList.toggle('rail-min'));
$('#hamb').addEventListener('click',()=>app.classList.toggle('rail-open'));
const fab=$('#fab');
$('#fabBtn').addEventListener('click',()=>{ const o=fab.classList.toggle('open'); $('#fabBtn').setAttribute('aria-expanded',o); });
function toast(msg,icon='check'){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`${I(icon)} ${msg}`; $('#toasts').appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(12px)';setTimeout(()=>t.remove(),320);},2600); }
/* bell navigates to Messages via data-nav delegation (no extra listener) */

/* ---- Privacy mode (mask balances app-wide; persists) ---- */
const privBtn=$('#privBtn');
function applyPriv(on){ document.documentElement.classList.toggle('priv',on); privBtn.setAttribute('aria-pressed',on); privBtn.innerHTML=I(on?'eye-off':'eye'); try{localStorage.setItem('tv3-priv',on?'1':'0');}catch(e){} }
privBtn.addEventListener('click',()=>{ const on=!document.documentElement.classList.contains('priv'); applyPriv(on); toast(on?'Privacy mode on — balances hidden':'Privacy mode off', on?'eye-off':'eye'); });
applyPriv((()=>{ try{return localStorage.getItem('tv3-priv')==='1';}catch(e){return false;} })());

/* ---- Data freshness / sync ---- */
const syncBtn=$('#syncBtn'), freshTxt=$('#freshTxt');
let freshAt=Date.now();
function freshLabel(){ const m=Math.round((Date.now()-freshAt)/60000); return m<1?'Synced just now':`Synced ${m}m ago`; }
setInterval(()=>{ if(!syncBtn.classList.contains('syncing')&&freshTxt) freshTxt.textContent=freshLabel(); }, 60000);
syncBtn.addEventListener('click',()=>{
  if(syncBtn.classList.contains('syncing'))return;
  syncBtn.classList.add('syncing'); if(freshTxt) freshTxt.textContent='Syncing…';
  const host=$('#wsHost'); if(host) host.innerHTML=skeletonHTML();
  setTimeout(()=>{ syncBtn.classList.remove('syncing'); freshAt=Date.now(); if(freshTxt) freshTxt.textContent='Synced just now'; toast('Accounts synced','check'); rerender(); }, 900);
});

/* ---- Connection health ---- */
$('#connBtn').addEventListener('click',()=>openDrawer('connections'));

document.addEventListener('click',e=>{
  const hs=e.target.closest('.hub-tab[data-sub]'); if(hs){ $$('#hubBar .hub-tab').forEach(x=>{const on=x===hs;x.classList.toggle('active',on);x.setAttribute('aria-selected',on);}); renderSub(hs.dataset.sub); pushRoute(hs.dataset.sub); viewport.scrollTop=0; return; }
  const mdi=e.target.closest('.md-item[data-acct]'); if(mdi){ const wrap=mdi.closest('.md'); wrap.querySelectorAll('.md-item').forEach(x=>{const on=x===mdi;x.classList.toggle('active',on);x.setAttribute('aria-selected',on);}); wrap.classList.add('show-detail'); const d=$('#acctDetail'); if(d){ d.innerHTML=acctDetailHTML(mdi.dataset.acct); d.querySelectorAll('[data-chart]').forEach(drawChartEl); } return; }
  const mdt=e.target.closest('.md-item[data-txn]'); if(mdt){ const wrap=mdt.closest('.md'); wrap.querySelectorAll('.md-item').forEach(x=>{const on=x===mdt;x.classList.toggle('active',on);x.setAttribute('aria-selected',on);}); wrap.classList.add('show-detail'); const d=$('#txnDetail'); if(d){ d.innerHTML=txnDetailHTML(mdt.dataset.txn); d.querySelectorAll('[data-chart]').forEach(drawChartEl); } return; }
  if(e.target.closest('[data-md-back]')){ const wrap=e.target.closest('.md'); if(wrap) wrap.classList.remove('show-detail'); return; }
  const nav=e.target.closest('[data-nav]'); if(nav){ e.preventDefault(); navigate(nav.dataset.nav); return; }
  const dr=e.target.closest('[data-drawer]'); if(dr){ e.preventDefault(); openDrawer(dr.dataset.drawer,dr.dataset.id); return; }
  if(e.target.closest('[data-close-drawer]')){ closeDrawer(); return; }
  const dtab=e.target.closest('[data-dtab]'); if(dtab){ const body=$('#drawerBody'); $$('#drawerTabs .drawer-tab').forEach(t=>{const on=t===dtab;t.classList.toggle('active',on);t.setAttribute('aria-selected',on);}); body.innerHTML=body.__panels[+dtab.dataset.dtab]; body.querySelectorAll('[data-chart]').forEach(drawChartEl); return; }
  const nwt=e.target.closest('#nwType [data-t]'); if(nwt){ nwType=nwt.dataset.t; $$('#nwType button').forEach(b=>b.classList.toggle('active',b===nwt)); drawNW(); return; }
  const nwr=e.target.closest('#nwRange [data-r]'); if(nwr){ nwRange=nwr.dataset.r; $$('#nwRange button').forEach(b=>b.classList.toggle('active',b===nwr)); drawNW(); return; }
  // BEGIN PARITY ADDITION — Transactions direction filter
  const td=e.target.closest('#txnDir [data-dir]'); if(td){ txnDir=td.dataset.dir; $$('#txnDir button').forEach(b=>b.classList.toggle('active',b===td)); const list=$('#txnMD .md-list'); if(list){ list.innerHTML=txnRowsHTML(); const first=list.querySelector('.md-item'); const d=$('#txnDetail'); if(first&&d){ d.innerHTML=txnDetailHTML(first.dataset.txn); d.querySelectorAll('[data-chart]').forEach(drawChartEl); } const md=$('#txnMD'); if(md) md.classList.remove('show-detail'); } return; }
  // END PARITY ADDITION
  // BEGIN PARITY ADDITION — Bills: selecting a payee loads it into the payment review
  const pp=e.target.closest('[data-payee]'); if(pp){ const sel=$('#pay-selected'); if(sel) sel.innerHTML=`${I('check')} Paying <strong>${pp.dataset.payee}</strong> · ${pp.dataset.payeeSub} — <span class="num" style="font-weight:700">${pp.dataset.payeeAmt}</span>`; const tot=$('#pay-total'); if(tot) tot.textContent=pp.dataset.payeeAmt; const card=$('#pay-review'); if(card){ card.scrollIntoView({behavior:'smooth',block:'center'}); card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); } return; }
  // END PARITY ADDITION
  const dot=e.target.closest('#aiDots [data-dot]'); if(dot){ aiGo(+dot.dataset.dot); return; }
  const aip=e.target.closest('[data-ai-toggle]'); if(aip){ aiPlaying=!aiPlaying; aip.innerHTML=aiPlaying?I('pause'):I('play'); return; }
  if(e.target.closest('#galleryCmdk')){ openCmdk(); return; }
  const ed=e.target.closest('[data-editprop]'); if(ed){ const c=$('#prop-edit'); if(c){ c.style.display=''; const nm=$('#prop-edit-name'); if(nm)nm.textContent=ed.dataset.editprop; const ad=$('#prop-edit-addr'); if(ad)ad.value=ed.dataset.editprop; c.scrollIntoView({behavior:'smooth',block:'center'}); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); } return; }
  if(e.target.closest('[data-editprop-cancel]')){ const c=$('#prop-edit'); if(c) c.style.display='none'; return; }
  const ssn=e.target.closest('[data-ssn]'); if(ssn){ const el=$('#ssnval'); if(el){ const shown=el.textContent.includes('6789'); el.textContent=shown?'•••-••-••••':'•••-••-6789'; ssn.innerHTML=(shown?I('lock')+' Show':I('lock')+' Hide'); } return; }
  // BEGIN PARITY ADDITION — KYC wizard step navigation
  const kn=e.target.closest('[data-kyc-next]'); if(kn){ kycStep=Math.min(kycStep+1,KYC_LABELS.length); const c=$('#kycCard'); if(c){ c.innerHTML=kycWizard(); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); } if(kycStep>=KYC_LABELS.length) toast('Identity verified','check'); return; }
  const kb=e.target.closest('[data-kyc-back]'); if(kb){ kycStep=Math.max(kycStep-1,0); const c=$('#kycCard'); if(c) c.innerHTML=kycWizard(); return; }
  if(e.target.closest('[data-kyc-reset]')){ kycStep=0; const c=$('#kycCard'); if(c) c.innerHTML=kycWizard(); return; }
  // END PARITY ADDITION
  // BEGIN PARITY ADDITION — household invite actions
  if(e.target.closest('[data-copy-invite]')){ toast('Invite link copied','link2'); return; }
  if(e.target.closest('[data-resend-invite]')){ toast('Invite resent','check'); return; }
  const rv=e.target.closest('[data-revoke-invite]'); if(rv){ const item=rv.closest('.rowitem'); if(item) item.remove(); const list=$('#inviteList'), cnt=$('#inviteCount'); if(list&&cnt) cnt.textContent=list.querySelectorAll('.rowitem').length; if(list&&!list.querySelector('.rowitem')) list.innerHTML='<p class="muted" style="font-size:var(--fs-sm)">No pending invites.</p>'; toast('Invite revoked','x'); return; }
  if(e.target.closest('[data-leave-household]')){ toast('You left the household','check'); return; }
  // END PARITY ADDITION
  const tg=e.target.closest('.tgl'); if(tg){ tg.classList.toggle('on'); tg.setAttribute('aria-checked',tg.classList.contains('on')); return; }
  const set=e.target.closest('.setlink[data-set]'); if(set){ $$('.setlink').forEach(x=>x.classList.toggle('active',x===set)); $$('#setPanels [data-setpanel]').forEach(p=>p.style.display=p.dataset.setpanel===set.dataset.set?'':'none'); return; }
  const tab=e.target.closest('.tab[data-tabidx]'); if(tab){ const block=tab.closest('.tabs-block'); if(!block) return; const idx=tab.dataset.tabidx;
    block.querySelectorAll(':scope > .tabs .tab').forEach(t=>t.classList.toggle('active',t===tab));
    block.querySelectorAll(':scope > .tabpanel').forEach(p=>p.style.display=p.dataset.tabidx===idx?'':'none');
    tab.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
    block.querySelectorAll(`:scope > .tabpanel[data-tabidx="${idx}"] [data-chart]`).forEach(drawChartEl);
    block.querySelectorAll(`:scope > .tabpanel[data-tabidx="${idx}"] [data-carousel]`).forEach(c=>{ if(!c.__init){ initCarousel(c); c.__init=true; } });
    return; }
});
document.addEventListener('change',e=>{ if(e.target.id==='nwFilter'){ nwFilter=e.target.value; drawNW(); } });
document.addEventListener('keydown',e=>{
  const kt=e.target;
  if((e.key==='Enter'||e.key===' ')&&kt.classList&&(kt.classList.contains('md-item')||(kt.classList.contains('chip')&&kt.hasAttribute('data-bizsel')))){ e.preventDefault(); kt.click(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); cmdk.classList.contains('show')?closeCmdk():openCmdk(); }
  if(e.key==='Escape'){ closeCmdk(); closeDrawer(); fab.classList.remove('open'); app.classList.remove('rail-open'); }
});
scrim.addEventListener('click',()=>{ closeCmdk(); closeDrawer(); app.classList.remove('rail-open'); });

applyTheme(themePref);
BOOTED = true;
applyRoute((location.hash.slice(2)) || 'overview');   /* deep-link aware: honor #/<id> on load */
history.replaceState({id:CURRENT}, '', '#/'+CURRENT);
